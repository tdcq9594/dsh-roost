name: 发版

# 什么时候跑：主分支 push（含 PR 合并）与手动触发。
#
# 触发方式从「推 tag」改成「版本变化」——发版清单第 2 步 bump 了 package.json 的
# version、PR 合并进 main 后，这里自动完成：校验 → 建 tag → 建 Release → 发 npm。
# 这样版本号、tag、Release、npm 四者由一次合并串行产生，不再靠人记住七步顺序。
#
# 为什么分 check / release 两个 job：
#   - check 只做校验和判定，失败就红，几秒出结果
#   - release 挂 environment: Release（required reviewers），发版前要人工批准，
#     把「提交前先问」变成系统闸门；needs + if 确保校验不过时不触发审批
#
# 为什么建 tag / Release / npm 都在 release 这一个 job：
#   GITHUB_TOKEN 触发的事件不会启动别的 workflow（dispatch 除外），
#   所以不能「建 tag → 触发另一个 job 建 Release」，必须一次做完。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支的连续 push 串行处理，避免两个发版 run 同时抢着建同一个 tag。
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    name: 发版前校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      mode: ${{ steps.decide.outputs.mode }}
      title: ${{ steps.decide.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 拉全历史，否则看不到旧 tag
          fetch-tags: true

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'    # OIDC trusted publishing 要 npm >= 11.5.1（Node 22 自带的是 npm 10）

      - name: 版本判定与 notes 校验
        id: decide
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          echo "version=$ver" >> "$GITHUB_OUTPUT"

          # 三段式判定：看当前版本的 tag 在不在、指向哪。
          # 递增校验在下面的独立块做，这里只认「这个版本的 tag 建没建」，不重复比大小。
          mode=''
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null 2>&1; then
            tag_sha=$(git rev-list -n 1 "v$ver")
            if [ "$tag_sha" = "$GITHUB_SHA" ]; then
              # 常规发版后 CI 重跑：tag 就在当前提交，续跑补建 Release/npm。
              echo "v$ver 的 tag 已指向当前提交 → resume"
              mode=resume
            else
              # 发版后又有普通改动合入（未 bump）：不该再发一次。
              echo "v$ver 的 tag 指向别的提交，当前是普通改动 → skip"
              mode=skip
            fi
          else
            echo "v$ver 尚无 tag → release"
            mode=release
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

          # skip 时显式说清「为什么没发版」，否则「改了代码却没发版」完全静默：
          # 两个 PR bump 到同一版本时，后合并的就落在这里。
          if [ "$mode" = "skip" ]; then
            {
              echo "### 本次不发版（skip）"
              echo ""
              echo "版本号是 \`$ver\`，但 tag \`v$ver\` 已经存在且**不指向**这次提交。"
              echo ""
              echo "两种可能："
              echo "- 这是发版后的普通改动（没 bump 版本）——正常，无需处理；"
              echo "- 你 bump 到的版本号已被别人先发了——本次改动**没有**对应版本。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # 递增校验（发版必须增版本）：取已发布的最大 vX.Y.Z，用 sort -V 比数值
          # 而非字符串（否则 1.10.0 会被当成小于 1.9.0）。只拦「版本倒退」：
          # - release：ver > latest 才真发版，满足「发版必须增版本」
          # - skip：ver == latest（发版后普通改动未 bump），相等不算倒退，正常跳过
          # - resume：ver == latest（tag 就在当前提交），相等正常续跑
          latest_ver=$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
          if [ -n "$latest_ver" ]; then
            bigger=$(printf '%s\n%s\n' "$latest_ver" "$ver" | sort -V | tail -1)
            if [ "$bigger" != "$ver" ]; then
              echo "版本倒退：package.json 是 v$ver，已发布最新是 v$latest_ver——发版必须递增版本号" >&2
              exit 1
            fi
            echo "递增校验通过：v$ver >= 已发布最新 v$latest_ver"
          fi

          # notes 校验：无论 release 还是 resume 都要过，skip 时也顺手校验（便宜）。
          head_line=$(grep -m1 '^## v' RELEASE_NOTES.md || true)
          if [ -z "$head_line" ]; then
            echo "RELEASE_NOTES.md 里没有 '## vX.Y.Z：' 开头的段落" >&2
            exit 1
          fi
          notes_ver=$(printf '%s' "$head_line" | sed -nE 's/^## v([0-9.]+).*/\1/p')
          if [ "$notes_ver" != "$ver" ]; then
            echo "RELEASE_NOTES 顶部段是 v$notes_ver，package.json 是 v$ver——先把新版 notes 写到最上面" >&2
            exit 1
          fi

          awk '/^## v/{n++} n==1' RELEASE_NOTES.md > "$RUNNER_TEMP/release-body.md"
          if ! grep -q '^一句话：' "$RUNNER_TEMP/release-body.md"; then
            echo "RELEASE_NOTES 顶部段缺「一句话：」开头的一行（面板靠它显示更新说明）" >&2
            exit 1
          fi

          title=$(printf '%s' "$head_line" | sed -E 's/^## (v[0-9.]+)：/\1 — /')
          echo "title=$title" >> "$GITHUB_OUTPUT"

  release:
    name: 建 tag / Release / 发 npm
    needs: check
    if: needs.check.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    environment: Release       # required reviewers = 主人；合并后仍需人工点批准才发
    permissions:
      contents: write          # 建 tag + Release
      id-token: write          # npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # 官方建议：发布构建不要缓存

      - name: 升级 npm（OIDC 改 dist-tag 要 >= 11.21.0，Node 24 自带的版本不够新）
        shell: bash
        run: npm i -g npm@^11.21.0

      - name: 生成 Release 正文（check job 的临时目录不共享，这里重取）
        shell: bash
        run: awk '/^## v/{n++} n==1' RELEASE_NOTES.md > "$RUNNER_TEMP/release-body.md"

      - name: 建 tag（已存在则跳过）
        if: needs.check.outputs.mode == 'release'
        shell: bash
        run: |
          ver="${{ needs.check.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null 2>&1; then
            echo "v$ver 已存在，跳过建 tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$ver" -m "${{ needs.check.outputs.title }}"
          git push origin "v$ver"

      - name: 建 Release（已存在则跳过，不覆盖人工内容）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ needs.check.outputs.version }}"
          tag="v$ver"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，跳过（不覆盖人工内容）"
            exit 0
          fi
          gh release create "$tag" --title "${{ needs.check.outputs.title }}" --notes-file "$RUNNER_TEMP/release-body.md"

      - name: 发 npm（OIDC trusted publishing · 已发布则跳过）
        shell: bash
        env:
          VER: ${{ needs.check.outputs.version }}
        run: |
          pkg="dsh-roost"
          # 幂等：resume 重跑 / 手动 dispatch 时这一版已经发过了，npm 只会回
          # `403 previously published`。先查一次，已发布就跳过，否则重跑会被拦成红。
          published=$(npm view "$pkg@$VER" version 2>/dev/null || true)
          if [ "$published" = "$VER" ]; then
            echo "$pkg@$VER 已在 npm 上，跳过发布（幂等）"
            exit 0
          fi
          if ! npm publish --access public; then
            echo "npm publish 失败。若日志是 403 previously published，说明并发/刚已入库，重跑即可；" >&2
            echo "其余失败需人工排查，不要在 workflow 里改版本号重发。" >&2
            exit 1
          fi

      - name: 发后自检：Release + npm 版本都指向新版本
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ needs.check.outputs.version }}"
          pkg="dsh-roost"
          # registry 和 GitHub 都有传播延迟，轮询等它们追上（12 次 × 15s ≈ 3 分钟）
          ok=0
          for i in $(seq 1 12); do
            pub=$(npm view "$pkg" version 2>/dev/null || true)
            rel=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || true)
            if [ "$pub" = "$ver" ] && [ "$rel" = "v$ver" ]; then ok=1; break; fi
            echo "等待传播（$i/12）：npm=$pub release=$rel"
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::error::发后自检失败：npm 或 releases/latest 没指向 v$ver，去核对再决定是否补发" >&2
            exit 1
          fi
          echo "OK：npm 与 releases/latest 都是 v$ver"

      - name: beta 标签对齐（OIDC dist-tag · 幂等）
        shell: bash
        run: |
          pkg="dsh-roost"
          beta=$(npm view "$pkg" dist-tags.beta 2>/dev/null || true)
          latest=$(npm view "$pkg" dist-tags.latest 2>/dev/null || true)
          if [ -z "$beta" ]; then
            echo "该包没有 beta 标签，跳过对齐"
            exit 0
          fi
          if [ "$beta" = "$latest" ]; then
            echo "beta 已等于 latest=$latest，无需对齐"
            exit 0
          fi
          # 规则：正式版高于 beta 就把 beta 指到最新版；beta 更高就保留测试通道不动。
          # 预发布号（1.2.3-beta.1）按 sort -V 也比正式版大，正好落入「不动」。
          bigger=$(printf '%s\n%s\n' "$beta" "$latest" | sort -V | tail -1)
          if [ "$bigger" = "$beta" ]; then
            echo "beta=$beta 不低于 latest=$latest，保留测试通道不动"
            exit 0
          fi
          npm dist-tag add "$pkg@$latest" beta
          echo "beta 已从 $beta 对齐到 $latest"
