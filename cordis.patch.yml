# dsh-roost —— DSH bundle patch（插件自带的挂载声明）
#
# 1) roost：插件本体（宿主半边 src/host.js + 网页半边 client/client.js）
# 2) 两个 agent preset，只给本插件建的 QQ 会话用：
#    - roost-private：私聊
#    - roost-social ：群聊
#
# 两档的差别**只有人格文案**——工具是一样的。
# 群聊要不要给本地工具由 config.json 的 chat.toolsInGroup 控制：
#   开着（默认）：群里也能读写文件、执行命令
#   关掉        ：插件用 tools.restrict 把 bash/fs/web 收走，群聊只剩聊天
#
# 人格正文由插件按配置动态注入（systemPrompt.context），
# 这里的 prefix 只放不随配置变的骨架。

- insert:
    - id: roost
      name: dsh-roost

    - id: preset-roost-private
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: roost-private
        name: Roost · 私聊
        description: 在 QQ 上和主人私聊时用
        order: 60
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你在用 QQ 和人私聊。回答简短、口语化，通常两三句话。
                不要说「作为 AI」「作为一个语言模型」这类话。
              # 人格独占系统提示词：不带 DSH 那一大段编程助手身份和工具指南，
              # 否则一轮要好几分钟。工具照样挂着，模型看工具定义就会用。
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    - id: preset-roost-social
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: roost-social
        name: Roost · 群聊
        description: 在 QQ 群里说话时用（本地工具由 toolsInGroup 控制）
        order: 61
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你在一个 QQ 群里说话。说话要短，别刷屏。
                不要说「作为 AI」「作为一个语言模型」这类话。
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
